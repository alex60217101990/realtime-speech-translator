name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            apt: libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev libpulse-dev
          - os: macos-14
            apt: ""
          - os: windows-2022
            apt: ""
    env:
      CGO_ENABLED: "1"
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -ldflags='-s -w' -o bin/translator ./cmd/translator
