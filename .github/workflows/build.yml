name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            apt: libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev libpulse-dev cmake ninja-build
          - os: macos-14
            apt: ""
          - os: windows-2022
            apt: ""
    env:
      CGO_ENABLED: "1"
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja || true

      - name: Build native deps
        shell: bash
        run: |
          ./scripts/build-deps.sh whisper
          ./scripts/build-deps.sh sentencepiece
          ./scripts/build-deps.sh ctranslate2

      - name: Vet
        run: make vet

      # Routed through make so the cgo env (CPATH / LIBRARY_PATH /
      # CGO_CXXFLAGS) exported by the Makefile is in scope — otherwise
      # `go test` cannot resolve whisper.h / ctranslate2 / sentencepiece
      # headers and every cgo-touching package fails to build.
      - name: Test
        run: make test-race

      - name: Build
        run: make build
