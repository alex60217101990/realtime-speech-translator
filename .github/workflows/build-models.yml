# Manually-triggered model build pipeline.
#
# Converts source HuggingFace checkpoints (PyTorch / Marian) into
# CTranslate2 int8 exports inside a clean Linux container, tarballs
# them, and uploads each as an asset on the chosen GitHub Release.
#
# Trigger: Actions tab -> "build-models" -> Run workflow.
#
# Inputs:
#   release_tag   target tag for the release assets (default: models-v1)
#   models        space-separated list of manifest keys to build.
#                 Default is m2m100-418m-int8 only — small100 / opusmt
#                 entries require a working HF mirror; opt them in
#                 explicitly when the upstream is healthy.
#
# Caches:
#   - pip wheel cache (actions/setup-python cache: pip), keyed on
#     this workflow file.
#   - HuggingFace hub cache (~/.cache/huggingface) so re-runs skip
#     the 1-2 GB model download.
#
# Failure policy: each model is built in its own loop iteration. A
# 4xx/5xx from HF on one model is logged as ::error:: but does not
# abort the others; the job exits non-zero only if every requested
# model failed.

name: build-models

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach assets to"
        required: true
        default: "models-v1"
      models:
        description: "Space-separated manifest keys (m2m100-418m-int8 | small100-int8 | opusmt-ru-en | opusmt-en-ru)"
        required: true
        default: "m2m100-418m-int8"

permissions:
  contents: write  # needed to create / update the Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      MODELS:      ${{ github.event.inputs.models }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Re-key the pip cache only when this workflow's pinned
          # versions change; the file itself is the dependency
          # declaration since there's no requirements.txt.
          cache-dependency-path: .github/workflows/build-models.yml

      - name: Cache HuggingFace hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Model bytes are the same regardless of workflow version —
          # only the *set* of requested models matters. Key on that
          # and fall back to any previous hub cache for partial reuse.
          key: hf-${{ runner.os }}-${{ hashFiles('.github/workflows/build-models.yml') }}-${{ github.event.inputs.models }}
          restore-keys: |
            hf-${{ runner.os }}-${{ hashFiles('.github/workflows/build-models.yml') }}-
            hf-${{ runner.os }}-

      - name: Install converter toolchain
        run: |
          python -m pip install --upgrade pip
          # Versions pinned to the combination that actually works
          # together. torch 2.2.2 is the last x86-friendly release;
          # transformers 4.36 + ctranslate2 4.3.1 is the known-good
          # pairing for m2m100 / OPUS-MT / SMaLL-100 conversion.
          pip install --only-binary=:all: \
            'numpy<2' \
            'torch==2.2.2' \
            'transformers==4.36.2' \
            'ctranslate2==4.3.1' \
            'sentencepiece' \
            'protobuf<5' \
            'sacremoses'   # required by MarianTokenizer (OPUS-MT)

      - name: Convert models
        env:
          # Optional: set a HF_TOKEN repo secret (Settings -> Secrets ->
          # Actions) to pull gated / renamed models. Public models work
          # without it.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p out

          # If a token is present, log into the HF cache so every
          # subsequent transformer download picks it up automatically.
          if [[ -n "${HF_TOKEN:-}" ]]; then
            python -c "from huggingface_hub import login; import os; login(os.environ['HF_TOKEN'])"
          fi

          # Common helper to bake a tarball and report its contents.
          # Logging the directory listing before tar makes it obvious
          # when a vocab file is missing (CT2 fails at runtime with
          # "Cannot load the target vocabulary" otherwise).
          finalise() {
            local out_dir="$1"
            echo "::group::Contents of out/$out_dir"
            ls -la "out/$out_dir"
            echo "::endgroup::"
            tar -C out -czf "out/${out_dir}.tar.gz" "$out_dir"
            echo "::notice::built out/${out_dir}.tar.gz ($(du -h "out/${out_dir}.tar.gz" | cut -f1))"
          }

          convert_m2m100() {
            local out_dir="$1"
            local hf_model="$2"
            # vocab.json carries the integer-token table CT2 needs at
            # load time; ct2-transformers-converter does not regenerate
            # it for m2m100, so we must request it explicitly.
            # sentencepiece.bpe.model is the BPE tokenizer used at
            # runtime by our Go SentencePiece wrapper.
            ct2-transformers-converter \
              --force \
              --model "$hf_model" \
              --output_dir "out/$out_dir" \
              --quantization int8 \
              --copy_files \
                tokenizer_config.json \
                special_tokens_map.json \
                sentencepiece.bpe.model \
                vocab.json
            finalise "$out_dir"
          }

          convert_opusmt() {
            local out_dir="$1"
            local hf_model="$2"
            # Marian models ship source.spm + target.spm + vocab.json
            # instead of a single sentencepiece file.
            ct2-transformers-converter \
              --force \
              --model "$hf_model" \
              --output_dir "out/$out_dir" \
              --quantization int8 \
              --copy_files tokenizer_config.json source.spm target.spm vocab.json
            finalise "$out_dir"
          }

          # Each iteration runs in a subshell with errors trapped, so
          # one HF 401/404 doesn't cascade into the rest.
          ok_count=0
          fail_count=0
          for key in $MODELS; do
            echo "::group::Build $key"
            (
              set -e
              case "$key" in
                m2m100-418m-int8)
                  convert_m2m100 m2m100-418m-int8 facebook/m2m100_418M ;;
                small100-int8)
                  convert_m2m100 small100-int8 alirezamshi/small100 ;;
                opusmt-ru-en)
                  convert_opusmt opusmt-ru-en Helsinki-NLP/opus-mt-ru-en ;;
                opusmt-en-ru)
                  convert_opusmt opusmt-en-ru Helsinki-NLP/opus-mt-en-ru ;;
                *)
                  echo "::error::unknown model key: $key"
                  exit 1 ;;
              esac
            )
            rc=$?
            echo "::endgroup::"
            if [[ $rc -eq 0 ]]; then
              ok_count=$((ok_count + 1))
              echo "::notice::$key built ok"
            else
              fail_count=$((fail_count + 1))
              echo "::error::$key failed with exit $rc — likely HF 401/404. Set HF_TOKEN secret if the upstream is gated, or remove $key from the models input."
            fi
          done

          echo ""
          echo "Summary: $ok_count built, $fail_count failed"
          ls -lh out/*.tar.gz 2>/dev/null || true

          # Bail only if nothing was produced — partial success is fine.
          if [[ $ok_count -eq 0 ]]; then
            echo "::error::No models built — nothing to upload"
            exit 1
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Pre-built CT2 models (${{ env.RELEASE_TAG }})"
          body: |
            Pre-built CTranslate2 int8 exports — produced by the
            `build-models` workflow. The application's Models Manager
            pulls these directly; users do not need Python or any ML
            toolchain to install them.
          files: |
            out/*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: false
