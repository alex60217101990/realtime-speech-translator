# Machine translation models. Both backends share the CTranslate2
# runtime; OPUS-MT additionally requires per-pair sentencepiece models
# (source.spm + target.spm) bundled alongside the ct2 export.
mt:
  # Quality tier — high accuracy, multilingual, but heavy on CPU.
  # On a 6-core Intel laptop expect 10-20 s per utterance; recommended
  # for offline / batch use, not realtime.
  madlad-400-3b-int8:
    url: https://huggingface.co/santhosh/madlad400-3b-ct2/resolve/main/model.bin
    config_url: https://huggingface.co/santhosh/madlad400-3b-ct2/resolve/main/config.json
    vocab_url: https://huggingface.co/santhosh/madlad400-3b-ct2/resolve/main/shared_vocabulary.json
    vocab_name: shared_vocabulary.json
    tokenizer_url: https://huggingface.co/santhosh/madlad400-3b-ct2/resolve/main/sentencepiece.model
    size_mb: 2960
    backend: madlad
    tier: quality

  # Balanced tier — multilingual, ~7× smaller than MADLAD-3B. Typical
  # CPU latency 1-3 s per utterance. Recommended realtime default when
  # the user wants many languages from a single model.
  #
  # Hosted as a pre-converted CTranslate2 tarball on this project's
  # GitHub Releases (built by .github/workflows/build-models.yml so
  # users don't need to install Python / torch / ctranslate2).
  m2m100-418m-int8:
    url: https://github.com/alex60217101990/realtime-speech-translator/releases/download/models-v1/m2m100-418m-int8.tar.gz
    size_mb: 500
    backend: m2m100
    tier: balanced
    archive: true
    default: true

  # Realtime tier — SMaLL-100 (Mohammadshahi et al., EMNLP'22), a
  # 330M-parameter distilled m2m100. ~20-30% faster than m2m100-418M
  # on CPU and better quality on low-resource pairs; covers the same
  # 100 languages.
  #
  # Tagging scheme differs from m2m100: the target-language tag goes
  # on the encoder side, and the decoder gets no special prefix. Our
  # m2m100 loader handles both via the TargetPrefixOnSource flag.
  small100-int8:
    url: https://github.com/alex60217101990/realtime-speech-translator/releases/download/models-v1/small100-int8.tar.gz
    size_mb: 330
    backend: small100
    tier: realtime
    archive: true

  # Realtime tier — Helsinki-NLP OPUS-MT per-pair models would belong
  # here (~80MB / 200-500ms CPU, smallest and fastest), but the
  # canonical Helsinki-NLP repos host PyTorch weights only and the
  # community CT2 mirrors observed so far either 401 (gated) or 404.
  # Until a public CT2-export mirror is confirmed, OPUS-MT is a
  # manual-install backend: convert with `ctranslate2-converter`
  # (or unpack an Argos `.argosmodel` archive) and drop the result at
  # <data>/models/mt/opusmt/<src>-<dst>/. The application discovers
  # every pair under that root automatically.

